name: Build and Test
on:
  workflow_dispatch:
jobs:
  built-and-test-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: list 
        run: ls
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flask
        run: pip install flask  
      
        
